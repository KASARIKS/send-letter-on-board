<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="getletters", method="post">
        <input type="text" name="page"/>
        <input type="submit" name="Select page"/>
    </form>
    <ul>
        {{range .Letters}}
            <li>
                <div>{{ .Id }}, {{ .Header }}, {{ .Text }}, {{ .Owner_id }}</div>
            </li>
        {{end}}
    </ul>
</body>
</html>
